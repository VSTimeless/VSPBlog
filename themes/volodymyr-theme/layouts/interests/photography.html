{{ define "main" }}
<div class="section">
    <h1 class="section-title">{{ .Title }}</h1>
    
    {{ if .Content }}
    <div class="section-content">
        {{ .Content }}
    </div>
    {{ end }}
    
    <div class="photo-gallery">
        {{ range .Params.gallery }}
        <div class="photo-item">
            <img src="{{ . }}" alt="Photography by Volodymyr">
        </div>
        {{ end }}
    </div>
    
    <style>
        /* Additional styles for the lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 4px;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            background: transparent;
            border: none;
            cursor: pointer;
        }
    </style>
</div>
{{ end }}
