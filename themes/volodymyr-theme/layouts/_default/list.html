{{ define "main" }}
<div class="list-content">
    <h1>{{ .Title }}</h1>
    
    {{ if .Content }}
    <div class="section-content">
        {{ .Content }}
    </div>
    {{ end }}
    
    <div class="card-grid">
        {{ range .Pages }}
        <div class="card">
            <h3>{{ .Title }}</h3>
            {{ if eq .Section "blog" }}
            <p class="date">{{ .Date.Format "January 2, 2006" }}</p>
            {{ end }}
            <p>{{ .Summary }}</p>
            <a href="{{ .Permalink }}" class="button">
                {{ if eq .Section "blog" }}Read More{{ else }}View Details{{ end }}
            </a>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
